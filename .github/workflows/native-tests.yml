# CI — host-native unit tests for the pure, Arduino-free gate logic.
#
# These compile + RUN on a normal host toolchain (no ESP32 cross-compile, no board), so the
# safety-critical DECISION logic is verified on every push — independent of the WIP firmware
# link stage (see build.yml / docs/CI-STATUS.md). Today this locks in the W1 wipe-misfire fix:
# ONLY a clean `sm_wipe` may ever reach the authenticated wipe flow.
name: native-tests

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sm-command:
    name: sm-command classifier (host g++)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile + run the sm-command safety test
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/bootgate \
            firmware/test_harness/native/test_sm_command.cpp -o /tmp/test_sm_command
          /tmp/test_sm_command
          echo "sm-command safety invariant holds: only a clean sm_wipe -> WipeRequest"
